# Conservative quality-aware JointAdaSpec experiment on local Qwen2.5 7B/1.5B.
# @package _global_

defaults:
  - default
  - override /model_pairs: qwen25_7b_1p5b_local
  - _self_

experiment_name: "qwen25_7b_1p5b_jointadaspec_quality"

